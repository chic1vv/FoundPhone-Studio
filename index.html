<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>捡手机文学</title>
<style>
  /* 基础设置与背景 */
  body { 
    margin: 0; padding: 0; height: 100vh; display: flex; justify-content: center; align-items: center; 
    background-color: #2c2c2e; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  }
  
  /* 手机外壳 */
  .iphone { 
    width: 100%; max-width: 390px; height: 100vh; max-height: 844px; 
    background: #ffffff; border-radius: 45px; position: relative; overflow: hidden;
    display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    border: 6px solid #1a1a1a;
  }

  /* 灵动岛 (Dynamic Island) */
  .dynamic-island {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 30px; background: #000; border-radius: 20px; z-index: 100;
  }

  /* 顶部状态栏 */
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 24px 5px 24px; font-size: 14px; font-weight: 600; color: #000;
  }
  .status-icons { display: flex; gap: 5px; font-size: 12px; }

  /* 聊天导航栏 (顶部) */
  .nav-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 15px; border-bottom: 0.5px solid #e5e5ea; background: rgba(249,249,249,0.9);
    backdrop-filter: blur(10px); z-index: 10;
  }
  .back-btn { color: #007aff; font-size: 16px; display: flex; align-items: center; }
  .contact-info { display: flex; flex-direction: column; align-items: center; }
  .contact-name { font-size: 14px; font-weight: 600; color: #000; }
  .contact-avatar { width: 40px; height: 40px; background: #ccc; border-radius: 50%; margin-bottom: 2px; display: flex; justify-content: center; align-items: center; font-size: 20px; }
  .video-icon { color: #007aff; font-size: 20px; }

  /* 聊天区域 */
  .chat-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: #fff; }
  
  /* 气泡通用样式 */
  .message {
    max-width: 70%; padding: 10px 14px; font-size: 15px; line-height: 1.4;
    position: relative; word-wrap: break-word; animation: popIn 0.2s ease-out; margin-bottom: 4px;
  }
  
  /* 接收方气泡 (灰色) */
  .received {
    background: #e5e5ea; color: #000; align-self: flex-start;
    border-radius: 18px; border-bottom-left-radius: 4px;
  }
  
  /* 发送方气泡 (苹果蓝) */
  .sent {
    background: #007aff; color: #fff; align-self: flex-end;
    border-radius: 18px; border-bottom-right-radius: 4px;
  }

  /* 已读小字 */
  .status-text { font-size: 11px; color: #8e8e93; align-self: flex-end; margin-top: -5px; margin-bottom: 5px; margin-right: 5px; }

  /* 底部输入框 (假的) */
  .input-area {
    padding: 10px 15px 25px 15px; background: #f9f9f9; border-top: 0.5px solid #e5e5ea;
    display: flex; align-items: center; gap: 10px;
  }
  .fake-input {
    flex: 1; background: #fff; border: 1px solid #d1d1d6; border-radius: 20px;
    padding: 8px 15px; color: #c7c7cc; font-size: 15px;
  }
  .send-btn { width: 30px; height: 30px; background: #007aff; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; }

  /* 底部 Home 条 */
  .home-indicator {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 130px; height: 5px; background: #000; border-radius: 10px;
  }

  /* 动画 */
  @keyframes popIn {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>

<div class="iphone">
  <!-- 灵动岛 -->
  <div class="dynamic-island"></div>

  <!-- 状态栏 -->
  <div class="status-bar">
    <span>9:41</span>
    <div class="status-icons">
      <span>📶</span> <span>5G</span> <span>🔋</span>
    </div>
  </div>

  <!-- 导航栏 -->
  <div class="nav-bar">
    <div class="back-btn">〈 12</div>
    <div class="contact-info">
      <div class="contact-avatar">👤</div>
      <div class="contact-name">未知联系人</div>
    </div>
    <div class="video-icon">📹</div>
  </div>

  <!-- 聊天内容区 -->
  <div class="chat-container">
    <!-- 对方发的 -->
    <div class="message received">你捡到我的手机了？</div>
    <!-- 自己发的 -->
    <div class="message sent">对，你手机还要不要了？</div>
    <div class="message received">要！你在哪，我来找你！</div>
    <div class="message sent">先转500块路费，不然我扔了。</div>
    
    <!-- 已读状态 -->
    <div class="status-text">已送达</div>
  </div>

  <!-- 底部输入框 -->
  <div class="input-area">
    <div class="fake-input">iMessage</div>
    <div class="send-btn">↑</div>
  </div>

  <!-- 底部横条 -->
  <div class="home-indicator"></div>
</div>

</body>
</html>
