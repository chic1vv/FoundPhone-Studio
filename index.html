<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>捡手机·交互版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #2c2c2e; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: -apple-system, sans-serif; overflow: hidden; }
  .iphone { width: 100%; max-width: 390px; height: 100vh; max-height: 844px; background: #fff; border-radius: 45px; position: relative; overflow: hidden; border: 6px solid #1a1a1a; display: flex; flex-direction: column; }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; }
  .screen.active { display: flex; }
  
  /* 锁屏界面 */
  #lock-screen { background: linear-gradient(135deg, #1a1a2e, #16213e); color: #fff; justify-content: center; align-items: center; }
  #lock-screen .time { font-size: 80px; font-weight: 200; }
  #lock-screen .date { font-size: 18px; margin-bottom: 50px; opacity: 0.8; }
  #lock-screen .unlock-btn { padding: 12px 40px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); border-radius: 30px; color: #fff; font-size: 16px; cursor: pointer; backdrop-filter: blur(10px); }

  /* 主屏幕 */
  #home-screen { background: url('https://picsum.photos/400/800') center/cover; padding-top: 60px; }
  .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 20px; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
  .app-icon { width: 60px; height: 60px; border-radius: 14px; display: flex; justify-content: center; align-items: center; font-size: 30px; background: rgba(255,255,255,0.8); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
  .app-name { font-size: 11px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

  /* 聊天界面 */
  #chat-screen { background: #fff; }
  .chat-header { background: #f9f9f9; padding: 50px 15px 10px; text-align: center; border-bottom: 1px solid #e5e5ea; font-weight: 600; }
  .chat-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 70%; padding: 10px 14px; border-radius: 18px; font-size: 15px; }
  .msg.received { background: #e5e5ea; align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.sent { background: #007aff; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .back-btn { position: absolute; top: 55px; left: 15px; color: #007aff; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>

<div class="iphone">
  <!-- 锁屏界面 -->
  <div id="lock-screen" class="screen active">
    <div class="time">9:41</div>
    <div class="date">11月1日 星期六</div>
    <div class="unlock-btn" onclick="unlock()">上滑解锁</div>
  </div>

  <!-- 主屏幕 -->
  <div id="home-screen" class="screen">
    <div class="app-grid">
      <div class="app" onclick="openApp('chat')">
        <div class="app-icon">💬</div>
        <div class="app-name">信息</div>
      </div>
      <div class="app" onclick="alert('相册功能开发中～')">
        <div class="app-icon">🖼️</div>
        <div class="app-name">相册</div>
      </div>
      <div class="app" onclick="alert('时钟功能开发中～')">
        <div class="app-icon">🕐</div>
        <div class="app-name">时钟</div>
      </div>
    </div>
  </div>

  <!-- 聊天界面 -->
  <div id="chat-screen" class="screen">
    <div class="chat-header">未知联系人</div>
    <div class="back-btn" onclick="goHome()">〈 返回</div>
    <div class="chat-body">
      <div class="msg received">你捡到我的手机了？</div>
      <div class="msg sent">对，你手机还要不要了？</div>
      <div class="msg received">要！你在哪，我来找你！</div>
    </div>
  </div>
</div>

<script>
  function unlock() {
    document.getElementById('lock-screen').classList.remove('active');
    document.getElementById('home-screen').classList.add('active');
  }
  function openApp(app) {
    if (app === 'chat') {
      document.getElementById('home-screen').classList.remove('active');
      document.getElementById('chat-screen').classList.add('active');
    }
  }
  function goHome() {
    document.getElementById('chat-screen').classList.remove('active');
    document.getElementById('home-screen').classList.add('active');
  }
</script>

</body>
</html>
