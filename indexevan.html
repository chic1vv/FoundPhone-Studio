```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>捡手机文学</title>
<style>
  body { background-color: #f0f0f5; font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .phone { width: 375px; height: 812px; background: #fff; border-radius: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); overflow: hidden; display: flex; flex-direction: column; position: relative; border: 8px solid #000; }
  .header { background: #f9f9f9; padding: 15px; text-align: center; font-weight: bold; border-bottom: 1px solid #ddd; font-size: 16px; }
  .chat { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: #fff; }
  .message { max-width: 75%; padding: 10px 15px; border-radius: 20px; font-size: 15px; line-height: 1.4; position: relative; animation: pop 0.2s ease-out; }
  .received { background: #e5e5ea; color: #000; align-self: flex-start; border-bottom-left-radius: 4px; }
  .sent { background: #0b93f6; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
<div class="phone">
  <div class="header">未知联系人</div>
  <div class="chat">
    <!-- 在这里修改你的对话，class="received"是对方发的，class="sent"是你发的 -->
    <div class="message received">你捡到我的手机了？</div>
    <div class="message sent">对，你手机还要不要了？</div>
    <div class="message received">要！你在哪，我来找你！</div>
    <div class="message sent">先转500块路费，不然我扔了。</div>
  </div>
</div>
</body>
</html>
